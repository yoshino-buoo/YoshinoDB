name: Sync official sources
on:
  schedule:
    # Daily 04:23 UTC / 13:23 Japan / 12:23 China. GitHub may delay schedules.
    - cron: "23 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: source-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync
        env:
          BILIBILI_FEED_URL: ${{ secrets.BILIBILI_FEED_URL }}
      - run: npm test
      - run: npm run build
      - name: Commit checked data and explicitly dispatch Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/generated.json public/assets/
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh official sources'
            git push
          fi
          # A push using GITHUB_TOKEN does not trigger push workflows.
          gh workflow run pages.yml --ref main
